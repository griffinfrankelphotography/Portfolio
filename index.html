<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Griffin Frankel Photography — People, city &amp; nature, and events." />
  <title>Griffin Frankel Photography</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <!-- Skip the intro splash if it's already played this session (runs before paint) -->
  <script>
    try { if (sessionStorage.getItem('introSeen')) document.documentElement.classList.add('intro-seen'); } catch (e) {}
  </script>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <h1 class="intro__title">
      <span>Griffin Frankel</span>
      <span class="intro__sub">Photography</span>
    </h1>
  </div>

  <header class="header">
    <div></div>
    <a class="brand" href="index.html" aria-label="Home">
      <span class="brand__name">Griffin Frankel</span>
      <span class="brand__tag">Photography</span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">Menu</button>
  </header>

  <nav class="nav-overlay" id="navOverlay" aria-label="Site navigation">
    <button class="nav-overlay__close" id="menuClose" aria-label="Close menu">Close</button>
    <ul class="nav-overlay__links">
      <li><a href="portrait.html">People</a></li>
      <li><a href="city-nature.html">City &amp; Nature</a></li>
      <li><a href="events.html">Events</a></li>
      <li class="nav-overlay__divider" aria-hidden="true"></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section class="landing">
      <div class="landing__content">
        <p class="landing__eyebrow">Photographer — New York</p>
        <nav class="landing__links" aria-label="Galleries">
          <a href="portrait.html">People</a>
          <a href="city-nature.html">City &amp; Nature</a>
          <a href="events.html">Events</a>
        </nav>
      </div>
    </section>
  </main>

  <script src="script.js?v=5"></script>
  <script>
    // Remove the splash from the DOM after it fades, and mark it seen for this session
    (function () {
      var intro = document.getElementById('intro');
      if (!intro) return;
      if (document.documentElement.classList.contains('intro-seen')) { intro.remove(); return; }
      try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
      intro.addEventListener('animationend', function (e) {
        if (e.animationName === 'introFade') intro.remove();
      });
      // Fallback in case the animationend event doesn't fire
      setTimeout(function () { if (intro.parentNode) intro.remove(); }, 3000);
    })();
  </script>
</body>
</html>
